<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mariana Pacheco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F5F1EC;
    --warm-white: #FDFAF7;
    --brown: #8B6B4A;
    --dark-brown: #4A3728;
    --light-brown: #C4A882;
    --text: #2C2218;
    --text-light: #6B5744;
    --border: rgba(139,107,74,0.18);
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }

  body {
    font-family: 'Jost', sans-serif;
    background: var(--cream);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 0 20px 40px;
  }

  /* subtle background texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(196,168,130,0.12) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(139,107,74,0.08) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    padding-top: 0;
  }

  /* Avatar */
  .avatar-wrap {
    width: 100%;
    max-width: 440px;
    height: 400px;
    border-radius: 0;
    overflow: hidden;
    border: none;
    box-shadow: none;
    margin-bottom: 0;
    margin-top: 0;
    flex-shrink: 0;
    position: relative;
  }
  
  .avatar-wrap img {
    width: 100%; height: 100%;
    object-fit: cover; width: 100%; height: 100%;
    object-position: center 5%;
    display: block;
  }

  /* Name & title */
  .name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem;
    font-weight: 300;
    color: var(--dark-brown);
    letter-spacing: 0.03em;
    text-align: center;
    line-height: 1.1;
    margin-bottom: 6px; margin-top: 16px;
  }
  .name em { font-style: italic; color: var(--brown); }

  .tagline {
    font-size: 0.7rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--brown);
    text-align: center;
    margin-bottom: 10px;
  }

  /* thin divider */
  .sep {
    width: 32px;
    height: 1px;
    background: var(--light-brown);
    margin: 16px auto 28px;
  }

  /* BUTTONS */
  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 11px;
  }

  .link-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 16px 22px;
    text-decoration: none;
    font-family: 'Jost', sans-serif;
    font-size: 0.82rem;
    letter-spacing: 0.1em;
    font-weight: 400;
    transition: all 0.28s ease;
    border-radius: 2px;
    position: relative;
    overflow: hidden;
  }

  /* Primary style — dark */
  .link-btn.primary {
    background: var(--dark-brown);
    color: var(--cream);
    border: 1px solid var(--dark-brown);
  }
  .link-btn.primary:hover {
    background: var(--brown);
    border-color: var(--brown);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(74,55,40,0.22);
  }

  /* Secondary style — outlined */
  .link-btn.secondary {
    background: transparent;
    color: var(--dark-brown);
    border: 1px solid var(--border);
    background: rgba(253,250,247,0.7);
  }
  .link-btn.secondary:hover {
    background: var(--warm-white);
    border-color: var(--brown);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(139,107,74,0.12);
  }

  /* Icon circle */
  .btn-icon {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .primary .btn-icon { background: rgba(255,255,255,0.12); }
  .secondary .btn-icon { background: rgba(139,107,74,0.1); }

  .btn-icon svg {
    width: 16px; height: 16px;
    stroke-width: 1.5;
    flex-shrink: 0;
  }
  .primary .btn-icon svg { stroke: var(--cream); fill: none; }
  .secondary .btn-icon svg { stroke: var(--brown); fill: none; }

  .btn-label { flex: 1; }

  .btn-arrow {
    font-size: 0.9rem;
    opacity: 0.5;
    transition: transform 0.28s, opacity 0.28s;
  }
  .link-btn:hover .btn-arrow { transform: translateX(4px); opacity: 1; }

  /* Social row */
  .social-row {
    display: flex;
    gap: 11px;
    width: 100%;
    margin-top: 4px;
  }
  .social-row .link-btn {
    flex: 1;
    padding: 14px 10px;
    justify-content: center;
    gap: 8px;
    font-size: 0.74rem;
  }
  .social-row .link-btn .btn-label {
    flex: unset;
  }

  /* Section label */
  .section-sep {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 6px 0 2px;
  }
  .section-sep span {
    font-size: 0.6rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--light-brown);
    white-space: nowrap;
  }
  .section-sep::before, .section-sep::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Footer */
  .footer {
    margin-top: 28px;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--light-brown);
    text-align: center;
  }

  /* Fade in animation */
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(16px); }
    to { opacity:1; transform:translateY(0); }
  }
  .avatar-wrap {
    width: 100%;
    max-width: 440px;
    height: 400px;
    border-radius: 0;
    overflow: hidden;
    border: none;
    box-shadow: none;
    margin-bottom: 0;
    margin-top: 0;
    flex-shrink: 0;
    position: relative;
  }
  .name { animation: fadeUp 0.6s 0.2s both; }
  .tagline { animation: fadeUp 0.6s 0.3s both; }
  .sep { animation: fadeUp 0.6s 0.35s both; }
  .links .link-btn:nth-child(1) { animation: fadeUp 0.5s 0.4s both; }
  .links .link-btn:nth-child(2) { animation: fadeUp 0.5s 0.48s both; }
  .links .link-btn:nth-child(3) { animation: fadeUp 0.5s 0.56s both; }
  .links .link-btn:nth-child(4) { animation: fadeUp 0.5s 0.64s both; }
  .section-sep { animation: fadeUp 0.5s 0.7s both; }
  .social-row { animation: fadeUp 0.5s 0.76s both; }
  .footer { animation: fadeUp 0.5s 0.88s both; }
  .avatar-wrap::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 100px;
    background: linear-gradient(to bottom, transparent, var(--cream));
    pointer-events: none;
  }
</style>
</head>
